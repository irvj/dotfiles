# --- better prefix ---
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- reload config ---
bind r source-file ~/.tmux.conf \; display "reloaded"

# --- start windows and panes at 1, not 0 ---
set -g base-index 1
setw -g pane-base-index 1

# --- keep window numbers sequential after closing one ---
set -g renumber-windows on

# --- easy splits ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# --- navigate panes with vim keys ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- resize panes ---
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- mouse support ---
set -g mouse on

# --- forward focus events to neovim ---
set -g focus-events on

# --- don't rename windows automatically ---
set -g allow-rename off

# --- longer history ---
set -g history-limit 50000

# --- faster escape ---
set -sg escape-time 0

# --- true color support ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"

# --- clipboard: forward OSC 52 yanks (e.g. from neovim over SSH) to the
#     outer terminal's clipboard. Default "external" catches the sequence
#     but never propagates it out; "on" forwards it. The outer terminal
#     already advertises the clipboard feature (xterm*:clipboard). ---
set -g set-clipboard on

# --- vi-style copy mode: v to start selection, y to yank (reaches the
#     system clipboard via set-clipboard above) ---
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# --- status bar ---
set -g status-position bottom
# Two-row status for padding between pane content and the bar. Copy the
# assembled default format down to row 1 (the real bar), then fill row 0
# with the terminal background so it reads as empty space, not a colored
# band. (A bare bg=default only sets the pen; `fill` actually paints the
# row over the status-style base.)
#
# NOTE: reload with `tmux kill-server` (fresh start), not `Prefix r`. On a
# re-source, status-format[1] already holds the bar, so re-copying the
# (now-modified) row 0 into it blanks the real bar.
set -Fg status-format[1] '#{status-format[0]}'
set -g status-format[0] '#[fill=#1a1c1b]'
set -g status 2
set -g status-style "bg=#242726,fg=#e8e4dc"
set -g status-left "#[fg=#1a1c1b,bg=#8fac98,bold]  #S #[fg=#8fac98,bg=#242726,nobold]"
set -g status-left-length 30
set -g status-right "#[fg=#2e312f,bg=#242726]#[fg=#e8e4dc,bg=#2e312f]  %H:%M #[fg=#8fac98,bg=#2e312f]#[fg=#e8e4dc,bg=#8fac98] #h "
set -g status-right-length 50
set -g status-justify left

# --- window tabs ---
set -g window-status-format "#[fg=#242726,bg=#2e312f]#[fg=#e8e4dc,bg=#2e312f] #I:#W #[fg=#2e312f,bg=#242726]"
set -g window-status-current-format "#[fg=#242726,bg=#95bebe]#[fg=#1a1c1b,bg=#95bebe,bold] #I:#W #[fg=#95bebe,bg=#242726,nobold]"
set -g window-status-separator ""

# --- pane borders ---
set -g pane-border-style "fg=#2e312f"
set -g pane-active-border-style "fg=#8fac98"

# --- message style ---
set -g message-style "bg=#8fac98,fg=#1a1c1b"
