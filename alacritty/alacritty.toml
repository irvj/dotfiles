[window]
padding = { x = 8, y = 8 }

[font]
size = 14.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[terminal.shell]
program = "wsl.exe"
args = ["-d", "jdev"]

[colors.primary]
foreground = "#e8e4dc"
background = "#1a1c1b"

[colors.cursor]
cursor = "#8fac98"
text = "#1a1c1b"

[colors.vi_mode_cursor]
cursor = "#8fac98"
text = "#1a1c1b"

[colors.selection]
background = "#3d4741"
text = "#e8e4dc"

[colors.normal]
black = "#141615"
red = "#cc8585"
green = "#7dba8a"
yellow = "#c9a86c"
blue = "#7eb8c9"
magenta = "#c9956c"
cyan = "#95bebe"
white = "#c5c1b8"

[colors.bright]
black = "#6b7369"
red = "#d99292"
green = "#a3bfac"
yellow = "#c9a86c"
blue = "#7eb8c9"
magenta = "#c9956c"
cyan = "#95bebe"
white = "#e8e4dc"
